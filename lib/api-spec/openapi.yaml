components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # ─── Dashboard ─────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalProjects, activeProjects, totalTasks, completedTasks, totalConversations, totalMemoryItems, totalPrompts, recentActivity, projectProgress]
      properties:
        totalProjects:
          type: integer
        activeProjects:
          type: integer
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        totalConversations:
          type: integer
        totalMemoryItems:
          type: integer
        totalPrompts:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        projectProgress:
          type: array
          items:
            $ref: "#/components/schemas/ProjectProgressItem"

    ActivityItem:
      type: object
      required: [id, type, description, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
        description:
          type: string
        createdAt:
          type: string

    ProjectProgressItem:
      type: object
      required: [id, name, totalTasks, completedTasks, status]
      properties:
        id:
          type: integer
        name:
          type: string
        totalTasks:
          type: integer
        completedTasks:
          type: integer
        status:
          type: string

    # ─── Projects ──────────────────────────────────────────
    Project:
      type: object
      required: [id, name, description, status, techStack, requirements, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [planning, active, paused, completed, archived]
        techStack:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [planning, active, paused, completed, archived]
        techStack:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [planning, active, paused, completed, archived]
        techStack:
          type: array
          items:
            type: string
        requirements:
          type: array
          items:
            type: string

    # ─── Tasks ─────────────────────────────────────────────
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        milestoneId:
          type: ["integer", "null"]
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        createdAt:
          type: string
        updatedAt:
          type: string

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        milestoneId:
          type: ["integer", "null"]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, review, done, cancelled]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        milestoneId:
          type: ["integer", "null"]

    # ─── Milestones ────────────────────────────────────────
    Milestone:
      type: object
      required: [id, projectId, name, description, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        description:
          type: string
        dueDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed]
        createdAt:
          type: string

    MilestoneInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        dueDate:
          type: string
        status:
          type: string
          enum: [pending, in_progress, completed]

    MilestoneUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        dueDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, in_progress, completed]

    # ─── Conversations ─────────────────────────────────────
    Conversation:
      type: object
      required: [id, title, agentType, pinned, messageCount, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        agentType:
          type: string
          enum: [coding, architecture, planning, documentation, testing, debugging, general]
        pinned:
          type: boolean
        projectId:
          type: ["integer", "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ConversationInput:
      type: object
      required: [title, agentType]
      properties:
        title:
          type: string
          minLength: 1
        agentType:
          type: string
