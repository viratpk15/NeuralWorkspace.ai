openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Neural Workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard statistics
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: milestones
    description: Milestone management
  - name: conversations
    description: AI conversation management
  - name: messages
    description: Conversation messages
  - name: memory
    description: Workspace memory
  - name: architecture
    description: Architecture studio
  - name: prompts
    description: Prompt library
  - name: documentation
    description: Documentation studio
  - name: settings
    description: Application settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Dashboard ───────────────────────────────────────────────
  /dashboard/stats:
